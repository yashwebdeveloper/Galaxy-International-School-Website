<!DOCTYPE html>

<html>

<head>

	<!----------------------------Meta Tag------------------------------->
	
	<meta charset="UTF-8">
	
	<meta name="description"
		content="Galaxy International School Website">
		
	<meta name="author"
		content="Yash">
		
	<meta name="viewport"	content="width=device-width, initial scale=1.0">
	
	<!-------------------------Fivicon-------------------------------->
	
	<link rel="icon"	href="School.png">
	
	<!------------------------External CSS Link------------------------>
	
	<link rel="Stylesheet"	href="style.css">
	
	<!---------------------------Website Title-------------------------->
	
	<title>Admission Page</title>
	
</head>

<body>

	<!-----------------------------Header----------------------------->
	
<header>

	<h1>Admission Enquiry Form</h1>
	
</header>

<section class="fields">

	<h2>Form Fields</h2>
	
</section>

	<!------------------------------Form-------------------------------->
	
<section class="container4">

<form>

	<label>Student Name</label>
	
		<input type="text">
		
	<br>
	<br>

	<label>Father's Name</label>
	
		<input type="text">
		
	<br>
	<br>
	
	<label>Mother's Name</label>
	
		<input type="text">
		
	<br>
	<br>
	
	<label>Date Of Birth</label>
	
		<input type="text">
		
	<br>
	<br>
	
	<label>Gender</label>
	
		<input type="radio"
			name="Gender">Male
			
		<input type="radio"
			name="Gender">Female
			
	<br>
	<br>
	
	<label>Class Applying For</label>
	
		<input type="checkbox">Class 1
		
		<input type="checkbox">class 2
		
		<input type="checkbox">class 3
		
		<input type="checkbox">class 4
		
		<input type="checkbox">class 5
		
	<br>
	<br>
	
	<label>Mobile Number</label>
		
		<input type="tel">
		
	<br>
	<br>
	
	<label>Email Address</label>
	
		<input type="email" required>
		
	<br>
	<br>
	
	<label>Address</label>
	
		<textarea></textarea>
		
	<br>
	<br>
	
	<label>Previous School Name</label>
	
		<input type="text">
		
	<br>
	<br>
	
	<label>Upload Documents</label>
	
		<input type="file">
		
	<br>
	<br>
	
	<input type="submit"
		value="Submit">
		
	<input type="reset"
		value="Reset">
		
</form>

</section>

	<!---------------------------------Admission Process------------------->
	
<section class="process">

	<h2>Admission Process</h2>
	
	<ol>
		
		<li>Fill Admission Form</li>
		
		<li>Submit Required Documents</li>
		
		<li>Attend Interaction Session</li>
		
		<li>Confirm Admission</li>
		
	</ol>
	
</section>

</body>

</html>
